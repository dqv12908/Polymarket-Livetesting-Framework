<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polymarket Live Testing</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#121a25;--line:#263244;--muted:#8fa0b7;--text:#edf2f8;--green:#32d583;--red:#f97066}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{width:min(1000px,94vw);margin:40px auto}h1{margin:0 0 4px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.card{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:26px;font-weight:700;margin-top:5px}.ok{color:var(--green)}.bad{color:var(--red)}pre{white-space:pre-wrap;word-break:break-word}footer{margin-top:20px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main><h1>Polymarket Live Testing</h1><div class="muted">Read-only public data · simulated IOC fills · no order submission</div><section class="grid"><div class="card"><div class="label">Service</div><div class="value" id="health">—</div></div><div class="card"><div class="label">Paper equity</div><div class="value" id="equity">—</div></div><div class="card"><div class="label">Realized P&amp;L</div><div class="value" id="pnl">—</div></div><div class="card"><div class="label">Open positions</div><div class="value" id="open">—</div></div><div class="card"><div class="label">Validated</div><div class="value" id="validated">—</div></div><div class="card"><div class="label">Validation accuracy</div><div class="value" id="accuracy">—</div></div></section><div class="card" style="margin-top:12px"><div class="label">Status payload</div><pre id="payload">Loading…</pre></div><footer id="updated"></footer></main><script>
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);async function refresh(){const h=document.getElementById('health');try{const r=await fetch('/v1/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),a=d.account;h.textContent='Paper only';h.className='value ok';document.getElementById('equity').textContent=money(a.equity_at_cost);document.getElementById('pnl').textContent=money(a.realized_pnl);document.getElementById('open').textContent=a.open_positions;document.getElementById('validated').textContent=a.validation_settled;document.getElementById('accuracy').textContent=a.validation_accuracy==null?'—':(100*a.validation_accuracy).toFixed(1)+'%';document.getElementById('payload').textContent=JSON.stringify(d,null,2);document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){h.textContent='Disconnected';h.className='value bad';document.getElementById('payload').textContent=e.message}}refresh();setInterval(refresh,5000)
</script></body></html>
