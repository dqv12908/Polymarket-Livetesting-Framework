[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-livetesting"
version = "0.2.0"
description = "Backtest and live paper test Polymarket strategies on your own machine. Public data, simulated fills, no real orders."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "dqv12908"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["websockets>=13"]

[project.optional-dependencies]
fast = ["orjson>=3.10"]
dev = ["build>=1.2", "pytest>=8.3", "ruff>=0.9"]

[project.scripts]
pm-live = "polymarket_livetesting.cli:main"

[project.urls]
Repository = "https://github.com/dqv12908/Polymarket-Livetesting-Framework"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polymarket_livetesting = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
